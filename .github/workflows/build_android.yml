name: Build Android KenLM Native

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Install Build Tools & Setup Boost Headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake libboost-dev zlib1g-dev
          mkdir -p android/include
          cp -r /usr/include/boost android/include/

      - name: Build for arm64-v8a
        run: |
          cmake -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            android/
          cmake --build build_arm64 --config Release -j$(nproc)

      - name: Build for armeabi-v7a
        run: |
          cmake -B build_arm32 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            android/
          cmake --build build_arm32 --config Release -j$(nproc)

      - name: Prepare Artifacts Directory
        run: |
          mkdir -p jniLibs/arm64-v8a
          mkdir -p jniLibs/armeabi-v7a
          cp build_arm64/libkenlm_native.so jniLibs/arm64-v8a/
          cp build_arm32/libkenlm_native.so jniLibs/armeabi-v7a/

      - name: Upload Native Android Libraries
        uses: actions/upload-artifact@v4
        with:
          name: kenlm-android-jniLibs
          path: jniLibs/
